<!doctype html>
<meta charset="utf-8">
<title>LeetCode GitHub Sync</title>
<style>body{font:14px system-ui;max-width:420px;margin:24px auto}label{display:block;margin:12px 0 4px}input{width:100%;padding:6px;box-sizing:border-box}button{margin-top:16px;padding:6px 14px}</style>
<h2>LeetCode GitHub Sync</h2>
<label>GitHub token (fine-grained, Contents read/write on this repo only)</label>
<input id="token" type="password" autocomplete="off">
<label>Owner</label><input id="owner">
<label>Repo</label><input id="repo">
<label>Branch</label><input id="branch">
<button id="save">Save</button> <span id="msg"></span>
<script src="options.js"></script>
